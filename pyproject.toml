[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "waldoi-chr-multinode_bandwidth_bottleneck_timeline_score"
version = "0.1.0"
description = "解析时间标记，排列分布式训练框架工程师·多机通信的带宽瓶颈的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "waldoi-chr" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://waldoi-chr.github.io"
Repository = "https://github.com/waldoi-chr/multinode_bandwidth_bottleneck_timeline_score"
Issues = "https://github.com/waldoi-chr/multinode_bandwidth_bottleneck_timeline_score/issues"

[project.scripts]
multinode_bandwidth_bottleneck_timeline_score = "multinode_bandwidth_bottleneck_timeline_score:main"

[tool.setuptools]
py-modules = ["multinode_bandwidth_bottleneck_timeline_score"]
